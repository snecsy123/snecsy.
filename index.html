<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snecsy ✧ Ascension</title>
  
  <!-- Divine Google Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ETHEREAL CELESTIAL WHITE PALETTE
    ========================================================= */
    :root {
      --void: #030304;
      --pure-white: #ffffff;
      --celestial-white: #f5f6fa;
      --silver-mist: rgba(255, 255, 255, 0.65);
      --diamond-glow: rgba(255, 255, 255, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.025);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-hover: rgba(255, 255, 255, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--void);
      color: var(--celestial-white);
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Cinematic Atmospheric Lighting */
    .celestial-space {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 50% 50%, #0a0a0e 0%, #030304 100%);
      z-index: 1;
    }

    /* Ethereal God Ray from Heaven */
    .god-ray {
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 130vh;
      background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.03) 45%, transparent 75%);
      pointer-events: none;
      filter: blur(50px);
      z-index: 2;
    }

    #celestial-dust {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* =========================================================
       CINEMATIC GATEWAY (INTRO SCREEN)
    ========================================================= */
    #sanctum-gate {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #08080c 0%, #020203 100%);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.4s;
    }

    #sanctum-gate.opened {
      opacity: 0;
      transform: scale(1.08);
      visibility: hidden;
      pointer-events: none;
    }

    /* Sacred Geometry Gateway Sigil */
    .sanctum-orb {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .orbital-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .ring-1 {
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: rotateCw 30s linear infinite;
    }

    .ring-2 {
      inset: 18px;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      animation: rotateCcw 20s linear infinite;
    }

    .ring-3 {
      inset: 38px;
      border: 1px dotted rgba(255, 255, 255, 0.55);
      animation: rotateCw 14s linear infinite;
    }

    .cross-axis {
      position: absolute;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    }

    .cross-axis.vertical {
      transform: rotate(90deg);
    }

    .core-diamond {
      width: 14px;
      height: 14px;
      background: #ffffff;
      transform: rotate(45deg);
      box-shadow: 
        0 0 25px 8px rgba(255, 255, 255, 0.8),
        0 0 60px 15px rgba(255, 255, 255, 0.4);
      animation: divineBreathe 3s infinite ease-in-out;
    }

    .gate-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.4rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 45px rgba(255, 255, 255, 0.3);
      margin-bottom: 0.8rem;
    }

    .gate-subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.3s;
    }

    #sanctum-gate:hover .gate-subtitle {
      color: rgba(255, 255, 255, 0.85);
    }

    /* =========================================================
       AUDIO CONTROLLER PILL
    ========================================================= */
    .music-widget {
      position: fixed;
      top: 2rem;
      right: 2rem;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 0.65rem 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .music-widget:hover {
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .music-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }

    .music-bar {
      width: 2px;
      background: #ffffff;
      height: 3px;
      border-radius: 2px;
      transition: height 0.2s ease;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    .playing .music-bar:nth-child(1) { animation: soundPulse 0.9s ease-in-out infinite alternate; }
    .playing .music-bar:nth-child(2) { animation: soundPulse 1.2s ease-in-out 0.2s infinite alternate; }
    .playing .music-bar:nth-child(3) { animation: soundPulse 0.8s ease-in-out 0.4s infinite alternate; }
    .playing .music-bar:nth-child(4) { animation: soundPulse 1.0s ease-in-out 0.1s infinite alternate; }

    .track-name {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--pure-white);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* =========================================================
       THE ASCENSION RELIC CARD
    ========================================================= */
    .stage {
      position: relative;
      z-index: 10;
      perspective: 1200px;
      padding: 1.5rem;
    }

    .card {
      position: relative;
      width: 440px;
      max-width: 90vw;
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 26px;
      border: 1px solid var(--glass-border);
      padding: 3.8rem 2.6rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.95),
        0 0 60px rgba(255, 255, 255, 0.04),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0.2, 1), border-color 0.4s ease;
    }

    .card:hover {
      border-color: var(--glass-border-hover);
    }

    /* Avatar & Triple Halo */
    .halo-wrapper {
      position: relative;
      width: 154px;
      height: 154px;
      margin-bottom: 2.2rem;
    }

    .halo-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .halo-outer {
      inset: -16px;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      animation: rotateCw 28s linear infinite;
    }

    .halo-inner {
      inset: -8px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 35px var(--diamond-glow);
    }

    .pfp-frame {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #09090c;
      border: 2px solid #ffffff;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.2);
    }

    .pfp-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Light Sweep Across Avatar */
    .pfp-frame::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -70%;
      width: 45%;
      height: 220%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(32deg);
      animation: divineShine 6s infinite ease-in-out;
    }

    /* User Identity Typography */
    .profile-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      background: linear-gradient(180deg, #ffffff 20%, #c9c9d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 20px rgba(255, 255, 255, 0.45));
      margin-bottom: 0.6rem;
    }

    .entity-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.35rem 1.1rem;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 1.6rem;
    }

    .pulse-core {
      width: 6px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffffff;
      animation: divineBreathe 2s infinite ease-in-out;
    }

    .tag-title {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
    }

    .verse-bio {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.8;
      margin-bottom: 2.2rem;
      font-weight: 300;
    }

    /* Actions Grid */
    .button-group {
      display: flex;
      gap: 0.9rem;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.85rem 1.4rem;
      border-radius: 12px;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.35s ease;
      position: relative;
      border: none;
      outline: none;
    }

    .action-btn.primary {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.25);
    }

    .action-btn.primary:hover {
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
    }

    .action-btn.secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: #ffffff;
    }

    .action-btn.secondary:hover {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    /* Copied Toast Notification */
    #copy-toast {
      position: fixed;
      bottom: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
      z-index: 1000;
      pointer-events: none;
    }

    #copy-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Keyframes */
    @keyframes rotateCw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotateCcw { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

    @keyframes divineBreathe {
      0%, 100% { transform: scale(1) rotate(45deg); opacity: 0.7; }
      50% { transform: scale(1.25) rotate(45deg); opacity: 1; }
    }

    @keyframes divineShine {
      0%, 15% { left: -80%; }
      50%, 100% { left: 180%; }
    }

    @keyframes soundPulse {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    @media (max-width: 480px) {
      .card { padding: 3rem 1.8rem 2.2rem; }
      .profile-name { font-size: 2rem; }
      .button-group { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Fields -->
  <div class="celestial-space"></div>
  <div class="god-ray"></div>
  <canvas id="celestial-dust"></canvas>

  <!-- Audio Source -->
  <audio id="sanctum-audio" loop preload="auto">
    <source src="solace.mp3" type="audio/mpeg">
  </audio>

  <!-- Cinematic Entry Gatekeeper -->
  <div id="sanctum-gate">
    <div class="sanctum-orb">
      <div class="orbital-ring ring-1"></div>
      <div class="orbital-ring ring-2"></div>
      <div class="orbital-ring ring-3"></div>
      <div class="cross-axis"></div>
      <div class="cross-axis vertical"></div>
      <div class="core-diamond"></div>
    </div>
    <div class="gate-title">Sanctum</div>
    <div class="gate-subtitle">Click anywhere to ascend</div>
  </div>

  <!-- Music Pill Control -->
  <div class="music-widget" id="music-widget" title="Toggle Hymn">
    <div class="music-bars" id="music-bars">
      <div class="music-bar"></div>
      <div class="music-bar"></div>
      <div class="music-bar"></div>
      <div class="music-bar"></div>
    </div>
    <span class="track-name">txmy — Solace</span>
  </div>

  <!-- Main Relic Stage -->
  <div class="stage">
    <div class="card" id="relic-card">
      
      <!-- Avatar Section with Triple Celestial Ring -->
      <div class="halo-wrapper">
        <div class="halo-ring halo-outer"></div>
        <div class="halo-ring halo-inner"></div>
        <div class="pfp-frame">
          <img src="pfp.png" alt="snecsy" class="pfp-img" onerror="this.src='https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=400&q=80'">
        </div>
      </div>

      <!-- Identity -->
      <h1 class="profile-name">snecsy</h1>

      <!-- Status Pill -->
      <div class="entity-tag">
        <span class="pulse-core"></span>
        <span class="tag-title">Ascended</span>
      </div>

      <!-- Bio -->
      <p class="verse-bio">
        Forged in darkness, crowned in light. Walking beyond the realm of mortals.
      </p>

      <!-- Clean Actions -->
      <div class="button-group">
        <a href="https://discord.com/users/snecsy" target="_blank" rel="noopener noreferrer" class="action-btn primary">
          <span>Discord</span>
        </a>
        <button class="action-btn secondary" id="copy-btn">
          <span>Copy Tag</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Copied Toast Notification -->
  <div id="copy-toast">Username Copied to Clipboard</div>

  <script>
    /* =========================================================
       AUDIO & CINEMATIC GATE UNSEAL
    ========================================================= */
    const gate = document.getElementById('sanctum-gate');
    const audioWidget = document.getElementById('music-widget');
    const audio = document.getElementById('sanctum-audio');
    let playing = false;

    gate.addEventListener('click', () => {
      gate.classList.add('opened');
      audio.volume = 0.5;
      audio.play().then(() => {
        playing = true;
        audioWidget.classList.add('playing');
      }).catch(e => console.log('Autoplay deferred:', e));
    });

    audioWidget.addEventListener('click', () => {
      if (playing) {
        audio.pause();
        audioWidget.classList.remove('playing');
      } else {
        audio.play();
        audioWidget.classList.add('playing');
      }
      playing = !playing;
    });

    /* =========================================================
       CLIPBOARD COPY
    ========================================================= */
    const copyBtn = document.getElementById('copy-btn');
    const toast = document.getElementById('copy-toast');

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText('snecsy').then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
    });

    /* =========================================================
       SMOOTH 3D CARD PARALLAX TILT
    ========================================================= */
    const card = document.getElementById('relic-card');

    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);
      card.style.transform = `rotateX(${-y * 10}deg) rotateY(${x * 10}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });

    /* =========================================================
       DIAMOND DUST & CELESTIAL STARDUST ENGINE
    ========================================================= */
    const canvas = document.getElementById('celestial-dust');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const count = 75;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Stardust {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 40;
        this.size = Math.random() * 1.5 + 0.3;
        this.vy = Math.random() * 0.7 + 0.2;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.decay = Math.random() * 0.003 + 0.001;
      }

      update() {
        this.y -= this.vy;
        this.x += this.vx;
        this.alpha -= this.decay;
        if (this.y < -10 || this.alpha <= 0) this.reset();
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffffff';
        ctx.fill();
        ctx.closePath();
      }
    }

    for (let i = 0; i < count; i++) {
      const dust = new Stardust();
      dust.y = Math.random() * canvas.height;
      particles.push(dust);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
